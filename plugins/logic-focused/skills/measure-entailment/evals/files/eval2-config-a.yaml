# Service A Configuration (production)
service:
  name: user-service
  port: 8080
  workers: 4

database:
  host: db.prod.internal
  port: 5432
  pool_size: 10
  ssl: true

cache:
  backend: redis
  ttl_seconds: 300
  max_entries: 10000

logging:
  level: info
  format: json
  destination: stdout

features:
  enable_signup: true
  enable_oauth: true
  enable_2fa: false
  rate_limit_per_minute: 60
